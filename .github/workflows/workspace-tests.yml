name: Workspace tests
on: [push, pull_request]
env:
  LAZYNEON_OFFLINE: '1'
  LAZYNEON_WS_NO_UPDATE_CHECK: '1'
jobs:
  node:
    name: node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: [20, 21, 22, 23, 24, 25]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # bash expands the glob; Node 20 --test does not.
      - run: node --test test/*.test.mjs
        shell: bash
  pytest:
    name: pytest 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # Test files read Korean UTF-8 fixtures with Path.read_text() defaults; Windows would use
    # the ANSI code page. Product scripts pass encoding='utf-8' explicitly.
    env:
      PYTHONUTF8: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      # Guards under test are Node hooks.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      # The repo .venv is what hallucination_guard and the CLIs look for first.
      - name: Create .venv and put it on PATH
        shell: bash
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" = Windows ]; then echo "$GITHUB_WORKSPACE\\.venv\\Scripts" >> "$GITHUB_PATH"; else echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"; fi
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
